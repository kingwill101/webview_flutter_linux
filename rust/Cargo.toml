[package]
name = "cef-texture-browser-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "cef_texture_browser_native"
crate-type = ["staticlib", "cdylib"]

[features]
# The Linux targets receive an $ORIGIN runpath from build.rs so libcef can live
# beside the native asset and subprocess helper.
default = []
cef-runtime = ["dep:cef"]
cef-accelerated = ["cef-runtime", "cef/accelerated_osr"]

[dependencies]
cef = { git = "https://github.com/tauri-apps/cef-rs", rev = "a2e15ae659c4b3957883e34de879bd8b38360ce5", default-features = false, features = ["resources"], optional = true }
irondash_texture = "0.5.0"

[[bin]]
name = "cef_texture_browser_helper"
path = "src/bin/cef_texture_browser_helper.rs"
required-features = ["cef-runtime"]

[profile.release]
lto = "thin"
panic = "abort"
strip = "symbols"
