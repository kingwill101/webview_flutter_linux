<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CEF surface smoke test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 180vh;
        background:
          linear-gradient(90deg, #23283a 1px, transparent 1px) 0 0 / 16px 16px,
          linear-gradient(#23283a 1px, transparent 1px) 0 0 / 16px 16px,
          #0d101a;
        color: #f5f2ff;
      }
      main { max-width: 760px; margin: auto; padding: 40px 28px 480px; }
      h1 { font-size: 32px; margin: 0 0 8px; }
      .subtle { color: #a9b1c9; }
      .card {
        margin-top: 28px;
        padding: 22px;
        border: 1px solid #566080;
        border-radius: 14px;
        background: #171b2aee;
      }
      label { display: block; margin-bottom: 8px; }
      input, button {
        min-height: 42px;
        border: 1px solid #7380aa;
        border-radius: 8px;
        background: #0d101a;
        color: inherit;
        font: inherit;
        padding: 8px 12px;
      }
      input { width: 100%; }
      button { margin-top: 12px; cursor: pointer; }
      button:hover { background: #413b82; }
      output { display: block; margin-top: 16px; color: #8ff0c8; }
      #wheel { position: sticky; top: 12px; }
      #motion {
        position: fixed;
        left: 0;
        bottom: 8px;
        width: 32px;
        height: 4px;
        background: #8ff0c8;
        opacity: 0;
        will-change: transform;
      }
      body.animate #motion {
        opacity: 1;
        animation: sweep 1s linear infinite alternate;
      }
      @keyframes sweep {
        from { transform: translateX(0); }
        to { transform: translateX(calc(100vw - 32px)); }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CEF surface smoke test</h1>
      <p class="subtle" id="metrics"></p>
      <section class="card">
        <label for="keyboard">Click here, then type through Flutter</label>
        <input id="keyboard" autocomplete="off" />
        <button id="button" type="button">Click through Flutter</button>
        <output id="status">Waiting for browser input</output>
      </section>
      <section class="card" id="wheel">
        Wheel and resize events: <strong id="events">0</strong>
      </section>
    </main>
    <div id="motion" aria-hidden="true"></div>
    <script>
      const metrics = document.querySelector('#metrics');
      const status = document.querySelector('#status');
      const events = document.querySelector('#events');
      let eventCount = 0;
      if (new URLSearchParams(location.search).has('animate')) {
        document.body.classList.add('animate');
      }
      function updateMetrics() {
        metrics.textContent = `${innerWidth}×${innerHeight} CSS px · DPR ${devicePixelRatio}`;
      }
      addEventListener('resize', () => {
        eventCount += 1;
        events.textContent = eventCount;
        updateMetrics();
      });
      addEventListener('wheel', () => {
        eventCount += 1;
        events.textContent = eventCount;
      });
      document.querySelector('#keyboard').addEventListener('input', (event) => {
        status.textContent = `Typed: ${event.target.value}`;
      });
      document.querySelector('#button').addEventListener('click', () => {
        status.textContent = 'Button clicked through Flutter';
      });
      document.addEventListener('contextmenu', () => {
        status.textContent = 'Context menu requested through Flutter';
      });
      updateMetrics();
    </script>
  </body>
</html>
